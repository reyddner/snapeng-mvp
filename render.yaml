# Render Blueprint — MVP SNAPENG (URL gratuita *.onrender.com)
# Dashboard: New → Blueprint → conecte o repo reyddner/snapeng-mvp
#
# Runtime Python (plano free). CSS Tailwind ja vai commitado em frontend/static/css/tailwind.css.
# SQLite efemero: ok para demo; dados podem zerar no sleep/redeploy.

services:
  - type: web
    name: snapeng-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements-prod.txt
    startCommand: >-
      cd backend &&
      alembic upgrade head &&
      (python scripts/load_templates.py || true) &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./snapeng.db"
      - key: ALLOWED_ORIGINS
        value: "https://snapeng-api.onrender.com"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,snapeng-api.onrender.com"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SEED_TEMPLATES
        value: "true"
      - key: REDIS_URL
        value: ""
