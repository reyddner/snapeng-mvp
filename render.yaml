# Render Blueprint — MVP SNAPENG
# https://dashboard.render.com/blueprints/new → repo reyddner/snapeng-mvp

services:
  - type: web
    name: snapeng-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements-prod.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./snapeng.db"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: SEED_TEMPLATES
        value: "true"
      - key: REDIS_URL
        value: ""
