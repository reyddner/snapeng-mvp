<!-- Arquivo: frontend/templates/components/navbar.html -->
<nav class="bg-white shadow-lg" x-data="snapengNavbar()" x-init="init()">
    <div class="container mx-auto px-4">
        <div class="flex justify-between items-center py-4">
            <a href="/" class="text-2xl font-bold text-blue-600">SNAPENG</a>
            <button @click="open = !open" class="md:hidden text-gray-700 px-2 py-1 border rounded" type="button" aria-label="Menu">
                Menu
            </button>
            <div class="hidden md:flex items-center space-x-4">
                <a href="/" class="text-gray-700 hover:text-blue-600">Início</a>
                <a href="/exemplos" class="text-gray-700 hover:text-blue-600">Exemplos</a>
                <a href="/memorials/new" class="text-gray-700 hover:text-blue-600">Novo memorial</a>
                <a href="/templates/select" class="text-gray-700 hover:text-blue-600">Templates</a>
                <a :href="dashboardHref" class="text-gray-700 hover:text-blue-600">Dashboard</a>
                <template x-if="!user">
                    <div class="flex items-center space-x-4">
                        <a href="/login" class="text-gray-700 hover:text-blue-600">Login</a>
                        <a href="/register" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Registrar</a>
                    </div>
                </template>
                <template x-if="user">
                    <div class="flex items-center space-x-3">
                        <span class="text-sm text-gray-600" x-text="userLabel"></span>
                        <button type="button" @click="logout()" class="bg-gray-100 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-200">Sair</button>
                    </div>
                </template>
            </div>
        </div>
        <div x-show="open" class="md:hidden pb-4 space-y-2" style="display: none;">
            <a href="/" class="block text-gray-700 hover:text-blue-600">Início</a>
            <a href="/exemplos" class="block text-gray-700 hover:text-blue-600">Exemplos</a>
            <a href="/memorials/new" class="block text-gray-700 hover:text-blue-600">Novo memorial</a>
            <a href="/templates/select" class="block text-gray-700 hover:text-blue-600">Templates</a>
            <a :href="dashboardHref" class="block text-gray-700 hover:text-blue-600">Dashboard</a>
            <template x-if="!user">
                <div class="space-y-2">
                    <a href="/login" class="block text-gray-700 hover:text-blue-600">Login</a>
                    <a href="/register" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Registrar</a>
                </div>
            </template>
            <template x-if="user">
                <div class="space-y-2">
                    <p class="text-sm text-gray-600" x-text="userLabel"></p>
                    <button type="button" @click="logout()" class="bg-gray-100 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-200">Sair</button>
                </div>
            </template>
        </div>
    </div>
</nav>

<script>
function snapengNavbar() {
    return {
        open: false,
        user: null,
        get userLabel() {
            if (!this.user) return '';
            return this.user.full_name || this.user.email || 'Conta';
        },
        get dashboardHref() {
            return this.user ? '/dashboard' : '/login?next=/dashboard';
        },
        async init() {
            if (!window.SnapEngAuth) return;
            try {
                this.user = await window.SnapEngAuth.getCurrentUser();
            } catch (_) {
                this.user = null;
            }
        },
        logout() {
            if (window.SnapEngAuth) window.SnapEngAuth.logout('/');
            else window.location.href = '/';
        }
    };
}
</script>
