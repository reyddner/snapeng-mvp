<!-- Arquivo: frontend/templates/login.html -->
{% extends "base.html" %}

{% block title %}Login - SNAPENG{% endblock %}

{% block content %}
<div x-data="loginForm()" class="max-w-md mx-auto mt-12">

    <div class="bg-white rounded-lg shadow p-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2 text-center">Login</h1>
        <p class="text-gray-600 text-center mb-6">Acesse projetos salvos na sua conta</p>
        <p class="text-sm text-center text-gray-500 mb-8">
            Prefere gerar sem cadastro?
            <a href="/memorials/new" class="text-blue-600 hover:text-blue-700 font-medium">Criar memorial agora</a>
        </p>

        <form @submit.prevent="login">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
                <input type="email" x-model="formData.email" required autocomplete="username"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Senha *</label>
                <input type="password" x-model="formData.password" required autocomplete="current-password"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div x-show="error" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg" x-text="error"></div>

            <button type="submit" :disabled="loading"
                    class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50 font-semibold">
                <span x-show="!loading">Entrar</span>
                <span x-show="loading">Entrando...</span>
            </button>

            <div class="mt-6 text-center text-gray-600">
                Não tem uma conta?
                <a href="/register" class="text-blue-600 hover:text-blue-700 font-semibold">Criar conta</a>
            </div>
        </form>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function loginForm() {
    return {
        formData: { email: '', password: '' },
        loading: false,
        error: null,

        formatDetail(detail) {
            if (!detail) return 'Erro ao fazer login';
            if (typeof detail === 'string') return detail;
            if (Array.isArray(detail)) return detail.map(item => item.msg || JSON.stringify(item)).join(' ');
            return 'Erro ao fazer login';
        },

        async login() {
            this.loading = true;
            this.error = null;
            try {
                const formData = new FormData();
                formData.append('username', this.formData.email);
                formData.append('password', this.formData.password);
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    body: formData,
                    credentials: 'include',
                });
                const data = await response.json();
                if (response.ok) {
                    if (window.SnapEngAuth) {
                        window.SnapEngAuth.setTokens();
                    }
                    const params = new URLSearchParams(window.location.search);
                    const next = params.get('next') || '/dashboard';
                    // Apenas path relativo local: começa com / mas não // (open redirect)
                    const safeNext = (next.startsWith('/') && !next.startsWith('//'))
                        ? next
                        : '/dashboard';
                    window.location.href = safeNext;
                } else {
                    this.error = this.formatDetail(data.detail);
                }
            } catch (error) {
                this.error = 'Erro ao fazer login: ' + error.message;
            } finally {
                this.loading = false;
            }
        }
    }
}
</script>
{% endblock %}
