name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        env:
          DEBUG: "true"
          SECRET_KEY: "ci-test-secret-key-with-enough-length-32chars"
          DATABASE_URL: "sqlite:///./ci_snapeng.db"
        run: python -m pytest backend/tests -q --tb=short
